<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bettermic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f13; --card: #17191f; --line: #262932; --text: #e9eaee; --muted: #8a8f9c;
    --accent: #7c8cff; --good: #3ddc97; --off: #3a3e4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #1d2140 0%, var(--bg) 60%);
    color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px #0008;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  #power {
    width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--off); color: var(--text); display: grid; place-items: center; transition: .2s;
  }
  #power.on { background: var(--accent); box-shadow: 0 0 0 6px #7c8cff33; }
  #power svg { width: 20px; height: 20px; }
  .label { color: var(--muted); font-size: 12px; margin: 18px 0 8px; display: flex; justify-content: space-between; }
  .meter { position: relative; height: 28px; border-radius: 8px; background: #0f1116; overflow: hidden; border: 1px solid var(--line); }
  #level { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #4b5470, #8a93b0); transition: width .05s linear; }
  .meter.open #level { background: linear-gradient(90deg, #1f8a63, var(--good)); }
  #thrMark { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .8; pointer-events: none; }
  #threshold { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
  .rows { display: grid; gap: 2px; margin-top: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; position: relative; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 22px; background: var(--off); transition: .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  select, input[type=range].vol {
    width: 100%; background: #0f1116; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 10px; font: inherit;
  }
  input[type=range].vol { padding: 0; height: 6px; accent-color: var(--accent); border: 0; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  .btn {
    border: 1px solid var(--line); background: #0f1116; color: var(--text); border-radius: 12px;
    padding: 11px; font: 500 14px Inter, system-ui, sans-serif; cursor: pointer; transition: .15s;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.active { background: var(--accent); border-color: var(--accent); }
  #rec.active { background: #e5484d; border-color: #e5484d; }
  #status { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; min-height: 1em; }
  #status a { color: var(--accent); }
</style>
</head>
<body>
<main class="card">
  <header>
    <h1>better<span>mic</span></h1>
    <button id="power" aria-label="Turn microphone on" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </header>

  <div class="label"><span>Input level · drag to set gate</span><span id="thrText">-50 dB</span></div>
  <div class="meter" id="meter">
    <div id="level"></div>
    <div id="thrMark"></div>
    <input id="threshold" type="range" min="-100" max="0" step="1" value="-50" aria-label="Voice gate threshold">
  </div>

  <div class="rows">
    <label class="row"><div>Noise suppression<small>Removes steady background noise</small></div>
      <span class="switch"><input type="checkbox" id="ns" checked><span></span></span></label>
    <label class="row"><div>Echo cancellation<small>Stops speakers bleeding into the mic</small></div>
      <span class="switch"><input type="checkbox" id="ec" checked><span></span></span></label>
    <label class="row"><div>Auto gain<small>Keeps your voice at a steady volume</small></div>
      <span class="switch"><input type="checkbox" id="agc" checked><span></span></span></label>
    <label class="row"><div>Voice gate<small>Silent until you speak</small></div>
      <span class="switch"><input type="checkbox" id="gate" checked><span></span></span></label>
    <label class="row"><div>Compressor<small>Evens out loud and quiet moments</small></div>
      <span class="switch"><input type="checkbox" id="comp" checked><span></span></span></label>
  </div>

  <div class="label"><span>Microphone</span></div>
  <select id="inDev" aria-label="Microphone"></select>
  <div class="label"><span>Output</span></div>
  <select id="outDev" aria-label="Output device"></select>
  <div class="label"><span>Volume</span><span id="volText">100%</span></div>
  <input id="vol" class="vol" type="range" min="0" max="200" value="100" aria-label="Output volume">

  <div class="actions">
    <button class="btn" id="live" disabled aria-pressed="false">Listen</button>
    <button class="btn" id="rec" disabled>Record</button>
  </div>
  <div id="status" role="status">Tap the mic to start</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get() { try { return JSON.parse(localStorage.getItem('bettermic') || '{}'); } catch { return {}; } },
  set(v) { try { localStorage.setItem('bettermic', JSON.stringify(v)); } catch {} },
};
const ids = ['ns', 'ec', 'agc', 'gate', 'comp', 'threshold', 'vol', 'inDev', 'outDev'];
const saved = store.get();
for (const id of ids) if (id in saved) $(id)[$(id).type === 'checkbox' ? 'checked' : 'value'] = saved[id];
const save = () => store.set(Object.fromEntries(ids.map((id) => [id, $(id).type === 'checkbox' ? $(id).checked : $(id).value])));

let ctx, stream, src, hpf, gateNode, comp, vol, limiter, dest, recorder, chunks = [];
const audio = new Audio();
audio.muted = true;

function setStatus(html) { $('status').innerHTML = html; }
function showThreshold() {
  const t = +$('threshold').value;
  $('thrText').textContent = `${t} dB`;
  $('thrMark').style.left = `${t + 100}%`;
  gateNode?.port.postMessage({ thresholdDb: t, enabled: $('gate').checked });
}
function applyComp() {
  if (!comp) return;
  const on = $('comp').checked; // ratio 1 = transparent bypass
  comp.threshold.value = on ? -24 : 0;
  comp.ratio.value = on ? 4 : 1;
}
function applyVol() {
  $('volText').textContent = `${$('vol').value}%`;
  if (vol) vol.gain.value = $('vol').value / 100;
}

async function listDevices() {
  const devs = await navigator.mediaDevices.enumerateDevices();
  for (const [sel, kind] of [[$('inDev'), 'audioinput'], [$('outDev'), 'audiooutput']]) {
    const keep = sel.value || saved[sel.id];
    sel.innerHTML = devs.filter((d) => d.kind === kind)
      .map((d, i) => `<option value="${d.deviceId}">${(d.label || `Device ${i + 1}`).replace(/</g, '&lt;')}</option>`).join('');
    if ([...sel.options].some((o) => o.value === keep)) sel.value = keep;
  }
  $('outDev').disabled = !('setSinkId' in audio);
}

async function openMic() {
  stream?.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ audio: {
    deviceId: $('inDev').value ? { exact: $('inDev').value } : undefined,
    echoCancellation: $('ec').checked,
    noiseSuppression: $('ns').checked,
    autoGainControl: $('agc').checked,
    channelCount: 1,
  } });
  src?.disconnect();
  src = ctx.createMediaStreamSource(stream);
  src.connect(hpf);
}

async function start() {
  ctx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' });
  await ctx.audioWorklet.addModule('gate-worklet.js');
  // Chain: mic (browser echo/noise/gain processing) → high-pass → voice gate → compressor → volume → limiter → out
  hpf = new BiquadFilterNode(ctx, { type: 'highpass', frequency: 80, Q: 0.707 });
  gateNode = new AudioWorkletNode(ctx, 'gate', { outputChannelCount: [1] });
  comp = new DynamicsCompressorNode(ctx, { knee: 10, attack: 0.003, release: 0.25 });
  vol = new GainNode(ctx);
  limiter = new DynamicsCompressorNode(ctx, { threshold: -1, knee: 0, ratio: 20, attack: 0.001, release: 0.05 });
  dest = ctx.createMediaStreamDestination();
  hpf.connect(gateNode).connect(comp).connect(vol).connect(limiter).connect(dest);

  gateNode.port.onmessage = ({ data }) => {
    const db = Math.max(-100, 20 * Math.log10(data.peak || 1e-5));
    $('level').style.width = `${db + 100}%`;
    $('meter').classList.toggle('open', data.open && $('gate').checked);
  };
  await openMic();
  await listDevices();
  audio.srcObject = dest.stream;
  await setOutput();
  audio.play();
  showThreshold(); applyComp(); applyVol();
}

async function setOutput() {
  if (!('setSinkId' in audio) || !$('outDev').value) return;
  try { await audio.setSinkId($('outDev').value); } catch (e) { setStatus(`Couldn't switch output: ${e.message}`); }
}

$('power').onclick = async () => {
  const on = !ctx;
  try {
    if (on) await start();
    else {
      stream.getTracks().forEach((t) => t.stop());
      if (recorder?.state === 'recording') recorder.stop();
      await ctx.close();
      ctx = null;
      $('level').style.width = '0';
    }
  } catch (e) {
    ctx?.close(); ctx = null;
    return setStatus(e.name === 'NotAllowedError' ? 'Microphone permission was denied' : `Couldn't start: ${e.message}`);
  }
  $('power').classList.toggle('on', on);
  $('power').setAttribute('aria-pressed', on);
  $('power').setAttribute('aria-label', on ? 'Turn microphone off' : 'Turn microphone on');
  $('live').disabled = $('rec').disabled = !on;
  if (!on) { audio.muted = true; $('live').classList.remove('active'); $('live').setAttribute('aria-pressed', false); }
  setStatus(on ? 'Mic is on' : 'Tap the mic to start');
};

$('live').onclick = () => {
  audio.muted = !audio.muted;
  $('live').classList.toggle('active', !audio.muted);
  $('live').setAttribute('aria-pressed', !audio.muted);
  setStatus(audio.muted ? 'Mic is on' : 'Sending processed audio to output — use headphones to avoid feedback');
};

$('rec').onclick = () => {
  if (recorder?.state === 'recording') return recorder.stop();
  chunks = [];
  recorder = new MediaRecorder(dest.stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    $('rec').classList.remove('active'); $('rec').textContent = 'Record';
    const url = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType }));
    setStatus(`<a href="${url}" download="recording.webm">Save recording</a>`);
  };
  recorder.start();
  $('rec').classList.add('active'); $('rec').textContent = 'Stop';
  setStatus('Recording…');
};

for (const id of ['ns', 'ec', 'agc', 'inDev']) $(id).onchange = () => { save(); if (ctx) openMic().catch((e) => setStatus(e.message)); };
$('gate').onchange = () => { save(); showThreshold(); };
$('threshold').oninput = () => { save(); showThreshold(); };
$('comp').onchange = () => { save(); applyComp(); };
$('vol').oninput = () => { save(); applyVol(); };
$('outDev').onchange = () => { save(); setOutput(); };
navigator.mediaDevices.ondevicechange = () => ctx && listDevices();
showThreshold(); applyVol();
</script>
</body>
</html>
